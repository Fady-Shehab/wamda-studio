<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منيو محمصة النيل | Nile Roastery — WhatsApp QR Menu Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #14110f;
      --card: #1f1a16;
      --border: rgba(245, 158, 11, 0.22);
      --text: #faf7f2;
      --muted: #b8aba0;
      --accent: #f59e0b;
      --green: #22c55e;
      --font-ar: 'Cairo', system-ui, sans-serif;
      --font-en: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-ar); line-height: 1.6;
      padding-block-end: 2.5rem;
    }
    html[lang="en"] body { font-family: var(--font-en); }
    .wrap { width: min(980px, calc(100% - 1.5rem)); margin-inline: auto; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
      padding-block: 1rem; border-block-end: 1px solid var(--border); flex-wrap: wrap;
    }
    .btn {
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.05);
      color: var(--text); padding: 0.5rem 0.9rem; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 0.86rem; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn-amber { background: var(--accent); color: #191206; border-color: transparent; }
    .btn-wa { background: var(--green); color: #05200e; border-color: transparent; }
    .hero-banner {
      margin-block: 1.25rem; padding: 1.35rem; border-radius: 16px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(31, 26, 22, 0.95));
      border: 1px solid var(--border);
    }
    .hero-banner h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    .hero-banner p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    .tabs { display: flex; gap: 0.5rem; margin-block: 1rem; flex-wrap: wrap; }
    .tab-btn.active { background: var(--accent); color: #191206; border-color: transparent; }
    .layout { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 1.2rem; align-items: start; }
    .menu-grid { display: grid; gap: 0.8rem; }
    .item-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    .item-card h3 { margin: 0 0 0.2rem; font-size: 1rem; }
    .item-card p { margin: 0; color: var(--muted); font-size: 0.84rem; }
    .price { color: var(--accent); font-weight: 800; font-size: 0.98rem; margin-block-start: 0.3rem; }
    .qty-box { display: flex; align-items: center; gap: 0.5rem; flex: none; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06); color: var(--text); font-weight: 800;
      font-size: 1rem; cursor: pointer;
    }
    .qty-btn.add { background: var(--accent); color: #191206; border-color: transparent; }
    .cart-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.15rem; position: sticky; top: 1rem;
    }
    .cart-panel h2 { margin: 0 0 0.8rem; font-size: 1.08rem; }
    .cart-items { display: grid; gap: 0.45rem; margin-block-end: 0.9rem; font-size: 0.88rem; }
    .cart-row { display: flex; justify-content: space-between; color: var(--text); }
    .field {
      width: 100%; padding: 0.55rem 0.75rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 0.86rem; margin-block-end: 0.65rem;
    }
    .total-line {
      display: flex; justify-content: space-between; font-weight: 800;
      font-size: 1.06rem; padding-block: 0.7rem; border-block: 1px solid var(--border);
      margin-block-end: 0.85rem;
    }
    .msg-preview {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.75rem; font-size: 0.8rem; color: var(--muted); white-space: pre-wrap;
      margin-block-start: 0.75rem;
    }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <strong id="brandTitle">☕ محمصة النيل — Nile Roastery (Demo)</strong>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <a class="btn" href="../index.html" id="backLink">عودة إلى ومضة ستوديو</a>
        <button class="btn btn-amber" id="langBtn" type="button">English</button>
      </div>
    </div>

    <div class="hero-banner">
      <h1 id="heroH1">منيو QR تفاعلي — اطلب مباشرة عبر واتساب (بدون اشتراك شهري)</h1>
      <p id="heroP">نموذج حي لمتاجر الأغذية والمقاهي: يختار العميل طلباته وتصل الرسالة منسّقة فوراً على واتساب المحل.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="btn tab-btn active" data-cat="all" id="tabAll" type="button">الكل</button>
      <button class="btn tab-btn" data-cat="coffee" id="tabCoffee" type="button">قهوة ساخنة</button>
      <button class="btn tab-btn" data-cat="cold" id="tabCold" type="button">مشروبات باردة</button>
      <button class="btn tab-btn" data-cat="dessert" id="tabDessert" type="button">حلويات</button>
    </div>

    <div class="layout">
      <div id="menuGrid" class="menu-grid"></div>

      <aside class="cart-panel">
        <h2 id="cartTitle">سلة الطلب</h2>
        <div id="cartItems" class="cart-items"></div>

        <select id="modeSelect" class="field">
          <option value="pickup">استلام من الفرع / Pickup</option>
          <option value="delivery">توصيل للمنزل / Delivery</option>
        </select>
        <input id="noteInput" class="field" type="text" placeholder="ملاحظة (مثلاً: سكر خفيف / طاولة 4)" />

        <div class="total-line">
          <span id="totalLbl">الإجمالي</span>
          <span id="totalVal">0 EGP</span>
        </div>

        <div style="display:grid;gap:0.5rem;">
          <a id="waSendBtn" class="btn btn-wa" href="#cartPanel" target="_blank" rel="noopener">معاينة رابط واتساب (Demo)</a>
          <button id="copyOrderBtn" class="btn" type="button">نسخ نص الطلب</button>
        </div>

        <div id="msgPreview" class="msg-preview"></div>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      const items = [
        { id: "esp", cat: "coffee", price: 65, ar: "دبل إسبريسو", arDesc: "تحميص وسط من حبوب أرابيكا مختارة", en: "Double Espresso", enDesc: "Medium-roast single-origin Arabica shot" },
        { id: "lat", cat: "coffee", price: 95, ar: "سبانش لاتيه", arDesc: "إسبريسو مع حليب مبخر وحليب مكثف", en: "Spanish Latte", enDesc: "Rich espresso with steamed and condensed milk" },
        { id: "ice", cat: "cold", price: 110, ar: "آيس كراميل ماكياتو", arDesc: "قهوة مثلجة مع صوص الكراميل المنزلي", en: "Iced Caramel Macchiato", enDesc: "Chilled espresso layered with house caramel" },
        { id: "mat", cat: "cold", price: 120, ar: "آيس ماتشا لاتيه", arDesc: "ماتشا يابانية مع حليب بارد", en: "Iced Matcha Latte", enDesc: "Ceremonial matcha over chilled milk" },
        { id: "che", cat: "dessert", price: 135, ar: "تشيز كيك سان سباستيان", arDesc: "تُقدّم مع صوص شوكولاتة بلجيكية", en: "San Sebastian Cheesecake", enDesc: "Creamy Basque cheesecake with chocolate drizzle" }
      ];

      const cart = { lat: 1 };
      let lang = "ar";
      let activeCat = "all";

      function formatOrderText() {
        const lines = [];
        let total = 0;
        items.forEach((it) => {
          const q = cart[it.id] || 0;
          if (q > 0) {
            const sub = q * it.price;
            total += sub;
            lines.push(`- ${q}x ${lang === "ar" ? it.ar : it.en} (${sub} EGP)`);
          }
        });
        const mode = document.getElementById("modeSelect").value;
        const note = document.getElementById("noteInput").value.trim() || "-";
        if (lines.length === 0) {
          return lang === "ar" ? "السلة فارغة — أضف صنفاً لمعاينة رسالة واتساب." : "Cart empty — add an item to preview WhatsApp message.";
        }
        return (lang === "ar" ? "طلب جديد - محمصة النيل:\n" : "New Order - Nile Roastery:\n") +
          lines.join("\n") +
          `\nMode: ${mode}\nNote: ${note}\nTotal: ${total} EGP`;
      }

      function render() {
        const grid = document.getElementById("menuGrid");
        grid.innerHTML = "";
        items.filter((i) => activeCat === "all" || i.cat === activeCat).forEach((it) => {
          const q = cart[it.id] || 0;
          const card = document.createElement("div");
          card.className = "item-card";
          card.innerHTML = `
            <div>
              <h3>${lang === "ar" ? it.ar : it.en}</h3>
              <p>${lang === "ar" ? it.arDesc : it.enDesc}</p>
              <div class="price">${it.price} ${lang === "ar" ? "ج.م" : "EGP"}</div>
            </div>
            <div class="qty-box">
              <button class="qty-btn" data-act="dec" data-id="${it.id}" type="button" aria-label="Decrease">−</button>
              <span>${q}</span>
              <button class="qty-btn add" data-act="inc" data-id="${it.id}" type="button" aria-label="Increase">+</button>
            </div>
          `;
          grid.appendChild(card);
        });

        const cartEl = document.getElementById("cartItems");
        cartEl.innerHTML = "";
        let total = 0;
        items.forEach((it) => {
          const q = cart[it.id] || 0;
          if (q > 0) {
            total += q * it.price;
            const row = document.createElement("div");
            row.className = "cart-row";
            row.innerHTML = `<span>${q}× ${lang === "ar" ? it.ar : it.en}</span><strong>${q * it.price} EGP</strong>`;
            cartEl.appendChild(row);
          }
        });
        if (total === 0) {
          cartEl.innerHTML = `<span style="color:var(--muted)">${lang === "ar" ? "اختر من المنيو لإضافته للسلة" : "Add items from the menu"}</span>`;
        }
        document.getElementById("totalVal").textContent = `${total} ${lang === "ar" ? "ج.م" : "EGP"}`;

        const text = formatOrderText();
        document.getElementById("msgPreview").textContent = text;
        // Sample wa.me link format with placeholder number 201000000000 for demo safety
        document.getElementById("waSendBtn").href = "https://wa.me/201000000000?text=" + encodeURIComponent(text);
      }

      function applyLang(next) {
        lang = next;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        const ar = lang === "ar";
        document.getElementById("brandTitle").textContent = ar ? "☕ محمصة النيل — Nile Roastery (معاينة)" : "☕ Nile Roastery — QR Menu (Demo)";
        document.getElementById("backLink").textContent = ar ? "عودة إلى ومضة ستوديو" : "Back to Wamda Studio";
        document.getElementById("langBtn").textContent = ar ? "English" : "العربية";
        document.getElementById("heroH1").textContent = ar ? "منيو QR تفاعلي — اطلب مباشرة عبر واتساب (بدون اشتراك شهري)" : "Interactive WhatsApp QR Menu — Zero Monthly Fees";
        document.getElementById("heroP").textContent = ar ? "نموذج حي للمقاهي والمتاجر: يختار العميل طلباته وتصل الرسالة منسّقة فوراً على واتساب." : "Live café & local-store catalog: customers build a cart and send formatted orders straight to WhatsApp.";
        document.getElementById("tabAll").textContent = ar ? "الكل" : "All";
        document.getElementById("tabCoffee").textContent = ar ? "قهوة ساخنة" : "Hot Coffee";
        document.getElementById("tabCold").textContent = ar ? "مشروبات باردة" : "Cold Drinks";
        document.getElementById("tabDessert").textContent = ar ? "حلويات" : "Desserts";
        document.getElementById("cartTitle").textContent = ar ? "سلة الطلب" : "Your Order Cart";
        document.getElementById("totalLbl").textContent = ar ? "الإجمالي" : "Total";
        document.getElementById("waSendBtn").textContent = ar ? "معاينة رابط واتساب (Demo)" : "Preview WhatsApp Order Link (Demo)";
        document.getElementById("copyOrderBtn").textContent = ar ? "نسخ نص الطلب" : "Copy Order Summary";
        render();
      }

      document.getElementById("menuGrid").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const act = btn.getAttribute("data-act");
        const cur = cart[id] || 0;
        cart[id] = act === "inc" ? cur + 1 : Math.max(0, cur - 1);
        render();
      });

      document.querySelectorAll(".tab-btn").forEach((b) => b.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        activeCat = b.getAttribute("data-cat");
        render();
      }));

      document.getElementById("langBtn").addEventListener("click", () => applyLang(lang === "ar" ? "en" : "ar"));
      document.getElementById("modeSelect").addEventListener("change", render);
      document.getElementById("noteInput").addEventListener("input", render);
      document.getElementById("copyOrderBtn").addEventListener("click", () => {
        try { navigator.clipboard.writeText(document.getElementById("msgPreview").textContent); } catch (e) {}
      });

      applyLang("ar");
    })();
  </script>
</body>
</html>
